<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#05090f"/>
    </linearGradient>
    <radialGradient id="white-pearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="black-pearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="loop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtly Textured Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e2e42" stroke-width="4"/>

  <!-- Grid Dots -->
  <g fill="#1e3a5f" opacity="0.6">
    <circle cx="128" cy="128" r="4"/>
    <circle cx="256" cy="128" r="4"/>
    <circle cx="384" cy="128" r="4"/>
    <circle cx="128" cy="256" r="4"/>
    <circle cx="256" cy="256" r="4"/>
    <circle cx="384" cy="256" r="4"/>
    <circle cx="128" cy="384" r="4"/>
    <circle cx="256" cy="384" r="4"/>
    <circle cx="384" cy="384" r="4"/>
  </g>

  <!-- Flowing Masyu Loop -->
  <path d="M 128 128 L 384 128 L 384 384 L 256 384 L 256 256 L 128 256 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#loop-glow)"/>

  <!-- White Pearl (Top-Center: straight pass-through) -->
  <circle cx="256" cy="128" r="38" fill="url(#white-pearl)" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Black Pearl (Bottom-Right: 90-degree turn with straight legs) -->
  <circle cx="384" cy="384" r="38" fill="url(#black-pearl)" stroke="#475569" stroke-width="4"/>
  <circle cx="370" cy="370" r="10" fill="white" opacity="0.4"/>

  <!-- Black Pearl (Center Turn) -->
  <circle cx="256" cy="256" r="38" fill="url(#black-pearl)" stroke="#475569" stroke-width="4"/>
  <circle cx="242" cy="242" r="10" fill="white" opacity="0.4"/>

  <!-- White Pearl (Left Edge) -->
  <circle cx="128" cy="192" r="38" fill="url(#white-pearl)" stroke="#cbd5e1" stroke-width="4"/>
</svg>
